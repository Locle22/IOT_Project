<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-A Sensor Config</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #d0e2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.12), 0 2px 8px rgba(0,0,0,0.06);
        }
        .logo {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 14px;
            font-size: 28px;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.35rem;
            color: #1e3a5f;
            text-align: center;
            margin-bottom: 2px;
        }
        .subtitle {
            text-align: center;
            font-size: 0.82rem;
            color: #6b7fa3;
            margin-bottom: 28px;
        }
        .section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            margin-top: 20px;
        }
        .section:first-of-type { margin-top: 0; }
        .section-line { flex: 1; height: 1px; background: #e0e7f1; }
        .section-title {
            font-size: 0.7rem;
            color: #3b82f6;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }
        label {
            display: block;
            font-size: 0.78rem;
            color: #6b7fa3;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .input-group { margin-bottom: 14px; }
        input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #e0e7f1;
            border-radius: 10px;
            background: #f7f9fc;
            color: #1e3a5f;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.25s;
        }
        input:focus {
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }
        input::placeholder { color: #b0bdd0; }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
        button:active { transform: translateY(0); }
        #status {
            text-align: center;
            margin-top: 14px;
            font-size: 0.82rem;
            min-height: 20px;
            font-weight: 500;
        }
        .ok { color: #16a34a; }
        .err { color: #dc2626; }
        .info { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">📡</div>
        </div>
        <h1>ESP32-A Sensor</h1>
        <p class="subtitle">Cấu hình kết nối mạng & MQTT</p>

        <div class="section">
            <span class="section-line"></span>
            <span class="section-title">WiFi</span>
            <span class="section-line"></span>
        </div>

        <div class="input-group">
            <label>SSID</label>
            <input id="ssid" placeholder="Nhập tên WiFi (2.4GHz)">
        </div>
        <div class="input-group">
            <label>Mật khẩu</label>
            <input id="pass" type="password" placeholder="Nhập mật khẩu WiFi">
        </div>

        <div class="section">
            <span class="section-line"></span>
            <span class="section-title">MQTT Broker</span>
            <span class="section-line"></span>
        </div>

        <div class="input-group">
            <label>Server IP</label>
            <input id="server" placeholder="VD: 192.168.1.190">
        </div>
        <div class="input-group">
            <label>Port</label>
            <input id="port" value="1883" placeholder="1883">
        </div>

        <button onclick="save()">Lưu & Khởi động lại</button>
        <div id="status"></div>
    </div>

    <script>
        function save() {
            const ssid = document.getElementById('ssid').value.trim();
            const pass = document.getElementById('pass').value;
            const server = document.getElementById('server').value.trim();
            const port = document.getElementById('port').value.trim();
            const status = document.getElementById('status');

            if (!ssid) { status.className='err'; status.textContent='Vui lòng nhập tên WiFi!'; return; }
            if (!server) { status.className='err'; status.textContent='Vui lòng nhập Server IP!'; return; }

            status.className='info'; status.textContent='Đang lưu cấu hình...';

            fetch('/connect?ssid='+encodeURIComponent(ssid)+'&pass='+encodeURIComponent(pass)+'&token=&server='+encodeURIComponent(server)+'&port='+encodeURIComponent(port))
                .then(r => r.text())
                .then(() => { status.className='ok'; status.textContent='✅ Đã lưu! Đang khởi động lại...'; })
                .catch(() => { status.className='ok'; status.textContent='✅ Đã lưu! ESP32 đang khởi động lại...'; });
        }
    </script>
</body>
</html>
